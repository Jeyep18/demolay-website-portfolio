<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Page not found · Naga City Chapter No. 120</title>
    <link rel="icon" href="/favicon.png" />
    <link rel="stylesheet" href="/fonts/chapter-fonts.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 24px;
        background: #091222;
        color: #f0f3f8;
        font-family: "DM Sans", system-ui, sans-serif;
      }
      main {
        width: min(100%, 660px);
        padding: clamp(26px, 7vw, 64px);
        border: 1px solid #ffffff24;
        border-radius: 24px;
        background: #142239;
      }
      .chapter {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #ddc385;
      }
      .chapter img {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      h1 {
        font-size: clamp(36px, 7vw, 64px);
        line-height: 1.05;
        letter-spacing: -0.055em;
        font-weight: 500;
        margin: 30px 0 16px;
      }
      .description {
        color: #b4c0d2;
        line-height: 1.6;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 26px;
      }
      nav a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 8px 16px;
        border: 1px solid #ffffff40;
        border-radius: 999px;
        color: inherit;
        text-decoration: none;
      }
      nav a:first-child {
        background: #ddc385;
        border-color: #ddc385;
        color: #091222;
      }
      nav a:hover {
        text-decoration: underline;
      }
      nav a:focus-visible {
        outline: 3px solid #ddc385;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="chapter">
        <img src="/images/chapter-seal.webp" width="48" height="48" alt="" />
        <span>Naga City Chapter No. 120</span>
      </div>
      <h1>Page not found</h1>
      <p class="description">This page may have moved or the address may have changed.</p>
      <nav aria-label="Find your way back">
        <a href="/">Back to Home</a>
        <a href="/events">Browse events</a>
      </nav>
    </main>
  </body>
</html>
